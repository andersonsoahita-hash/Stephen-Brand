<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stephen Anderson Soahita</title>
<meta name="description" content="Site personnel de Stephen Anderson Soahita : parcours, applications, livres, images, voix et Stephen Group.">
<meta name="theme-color" content="#0B2545">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--navy2:#13315C;--deep:#071a33;--gold:#C9A24B;--gold-d:#946F22;--ivory:#F5F3EE;--mut:#a9b4c8}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--deep);color:#ECE8DD;font-family:Inter,system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
.serif{font-family:Fraunces,Georgia,serif}
a{color:inherit}
/* nav */
nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:14px 4vw;background:linear-gradient(to bottom,rgba(7,26,51,.92),rgba(7,26,51,0));transition:background .3s}
nav.solid{background:rgba(7,26,51,.96);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(201,162,75,.18)}
nav .brand{font-family:Fraunces,serif;font-weight:600;font-size:18px;color:var(--gold);letter-spacing:.02em;text-decoration:none}
nav ul{display:flex;gap:22px;list-style:none}
nav ul a{font-size:13px;text-decoration:none;color:#d9dfeb;opacity:.85}
nav ul a:hover{color:var(--gold);opacity:1}
@media(max-width:860px){nav ul{display:none}}
/* hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;padding:120px 4vw 60px;background:linear-gradient(160deg,var(--navy2),var(--deep) 70%);overflow:hidden}
.hero .photo{position:absolute;right:0;top:0;bottom:0;width:min(52vw,720px)}
.hero .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hero .photo:after{content:"";position:absolute;inset:0;background:linear-gradient(to right,var(--navy2) 0%,rgba(19,49,92,.0) 45%),linear-gradient(to top,var(--deep) 0%,rgba(7,26,51,0) 30%)}
.hero .txt{position:relative;z-index:2;max-width:640px}
.kick{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:Fraunces,serif;font-weight:600;font-size:clamp(44px,7vw,92px);line-height:.98;letter-spacing:-.02em;color:#fff;margin:18px 0 22px}
.hero p.q{font-family:Fraunces,serif;font-style:italic;font-size:clamp(18px,2.2vw,26px);color:#ECE8DD;max-width:30ch;line-height:1.35}
.hero p.q b{color:var(--gold);font-weight:500}
.hero .words{margin-top:26px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:600}
.btns{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.btn{border:0;cursor:pointer;font:600 14px Inter,sans-serif;padding:13px 26px;border-radius:6px;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);color:#0B2545}.btn.gold:hover{background:#d9b25b}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff}.btn.ghost:hover{background:rgba(255,255,255,.18)}
@media(max-width:860px){.hero{align-items:flex-end;padding-top:40vh}.hero .photo{width:100%;height:62vh;bottom:auto}.hero .photo:after{background:linear-gradient(to top,var(--navy2) 5%,rgba(19,49,92,0) 70%)}}
/* rows */
main{position:relative;margin-top:0;z-index:3}
section.row{padding:34px 0 10px;scroll-margin-top:60px}
.rh{padding:0 4vw;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.rh h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,3vw,34px);color:#fff}
.rh span{font-size:13.5px;color:var(--mut)}
.rail{position:relative}
.track{display:flex;gap:14px;overflow-x:auto;padding:18px 4vw 30px;scroll-snap-type:x proximity;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.arr{position:absolute;top:50%;transform:translateY(-60%);z-index:5;width:44px;height:90px;border:0;cursor:pointer;color:#fff;font-size:26px;background:rgba(7,26,51,.75);opacity:0;transition:.2s;border-radius:6px}
.rail:hover .arr{opacity:1}
.arr.l{left:1vw}.arr.r{right:1vw}
@media(hover:none){.arr{display:none}}
.card{flex:none;width:clamp(170px,19vw,230px);aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;cursor:pointer;scroll-snap-align:start;border:1px solid rgba(255,255,255,.08);transition:transform .25s,box-shadow .25s;background:var(--navy);text-align:left;color:inherit;font:inherit;padding:0}
.card:hover,.card:focus-visible{transform:translateY(-6px) scale(1.04);box-shadow:0 14px 30px -10px rgba(0,0,0,.7),0 0 0 1px var(--gold);outline:none;z-index:2}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,26,51,.95) 0%,rgba(7,26,51,.35) 45%,rgba(7,26,51,0) 70%)}
.card .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 14px 16px}
.card .tag{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card .ttl{font-family:Fraunces,serif;font-weight:600;font-size:19px;line-height:1.15;color:#fff;margin-top:4px}
.card.typo{display:flex;flex-direction:column;justify-content:space-between;padding:16px}
.card.typo .big{font-family:Fraunces,serif;font-weight:600;font-size:54px;line-height:.95;color:rgba(255,255,255,.92);letter-spacing:-.02em}
.card.typo .big.s{font-size:34px}
.card.typo .cap{position:static;padding:0}
.card.app img{object-position:0% 0%}
.st{position:absolute;top:10px;left:10px;z-index:3;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:rgba(7,26,51,.82);color:#ECE8DD;border:1px solid rgba(201,162,75,.45)}
.st.prep{color:var(--gold)}
.cat{padding:80px 4vw 10px;border-top:1px solid rgba(201,162,75,.18);margin-top:30px;scroll-margin-top:50px}
.cat h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(34px,5.4vw,64px);color:#fff;line-height:1.02;margin:8px 0 6px}
.cat p{color:var(--mut);font-size:15px}
.sheet h4{font-family:Fraunces,serif;font-size:18px;color:var(--gold);font-weight:600;margin:18px 0 6px}

#bar{position:absolute;left:0;bottom:0;height:2px;background:var(--gold);width:0}
nav ul a.on{color:var(--gold);opacity:1;border-bottom:1px solid var(--gold);padding-bottom:3px}
.cat{max-width:1100px;margin:0 auto;padding:110px 5vw 10px}
.cat .intro{font-size:clamp(17px,1.6vw,20px);line-height:1.7;color:#d9dfeb;max-width:62ch;margin-top:12px}
.part{max-width:1100px;margin:0 auto;padding:40px 5vw 10px}
.ph{border-bottom:1px solid rgba(201,162,75,.25);padding-bottom:12px;margin-bottom:34px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.ph h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,3vw,32px);color:#fff}
.ph span{color:var(--mut);font-size:14px}
.art{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;margin-bottom:64px}
.art.alt{grid-template-columns:minmax(0,1fr) minmax(0,340px)}
.art.alt .vis{order:2}
.art .vis{position:sticky;top:90px;margin:0;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px -16px rgba(0,0,0,.7)}
.art .vis img{display:block;width:100%;height:auto}
.vis.typo{aspect-ratio:3/4;padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.vis.typo .big{font-family:Fraunces,serif;font-weight:600;font-size:clamp(54px,7vw,86px);line-height:.95;color:#fff;letter-spacing:-.02em}
.vis.typo .big.s{font-size:clamp(36px,4.4vw,56px)}
.vis.typo.bgp .big{text-shadow:0 2px 18px rgba(0,0,0,.55)}
.vis.typo.bgp figcaption{text-shadow:0 1px 8px rgba(0,0,0,.7)}
.vis.typo figcaption{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:600}
.vis.phone{border-radius:28px;border:5px solid #050f20;max-width:300px}
.vis.phone.wide{border-radius:10px;max-width:none}
.vis.contain{background:#FAF8F4;padding:20px}
.txt2 .t{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,3.6vw,42px);line-height:1.08;color:#fff;margin:6px 0 12px}
.badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid rgba(201,162,75,.55);color:var(--gold);margin-bottom:18px}
.badge.prep{background:rgba(201,162,75,.14)}
.txt2 p{font-size:17px;line-height:1.75;color:#e1e6f1;margin-bottom:14px;max-width:66ch}
.txt2 h4:not(.t){font-family:Fraunces,serif;font-size:20px;color:var(--gold);font-weight:600;margin:24px 0 6px}
.txt2 ul{margin:8px 0 16px 20px;font-size:16.5px;line-height:1.7;color:#e1e6f1}
.txt2 li{margin-bottom:6px}
.facts{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}
.facts div{flex:1 1 120px;max-width:200px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 16px}
.facts b{display:block;font-family:Fraunces,serif;font-size:32px;color:var(--gold);font-weight:600;line-height:1.1}
.facts span{font-size:13px;color:var(--mut)}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.more img{width:100%;border-radius:8px}
@media(max-width:820px){
 .art,.art.alt{grid-template-columns:1fr}
 .art.alt .vis{order:0}
 .art .vis{position:static;max-width:420px}
 .vis.phone{max-width:260px}
 .vis.typo{aspect-ratio:16/9}
  .cat{padding-top:80px}
}
.logos{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.logos img.dk{background:#1E2E40}
.logos img{height:58px;width:auto;background:#fff;border-radius:8px;padding:6px 10px;display:block}
/* fil rouge */
.thread{padding:70px 4vw 40px;text-align:center}
.thread h2{font-family:Fraunces,serif;font-size:clamp(30px,5vw,56px);color:#fff;font-weight:600}
.thread h2 em{color:var(--gold);font-style:italic;font-weight:500}
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:1100px;margin:34px auto 0;text-align:left}
.tri div{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-top:3px solid var(--gold);border-radius:10px;padding:22px}
.tri b{font-family:Fraunces,serif;font-size:24px;color:var(--gold);display:block;margin-bottom:8px;font-weight:600}
.tri p{font-size:14.5px;color:#d6dcea}
.quote{margin:46px auto 0;max-width:30ch;font-family:Fraunces,serif;font-style:italic;font-size:clamp(20px,3vw,30px);line-height:1.35;color:#ECE8DD}
.quote b{color:var(--gold);font-weight:500}
/* contact */
footer{padding:50px 4vw 60px;display:flex;gap:34px;flex-wrap:wrap;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.07);margin-top:50px}
footer .qr{display:flex;gap:14px;align-items:center;text-decoration:none}
footer .qr img{width:92px;height:92px;background:#fff;padding:6px;border-radius:8px}
footer .qr span{font-size:13px;color:var(--mut)}footer .qr b{display:block;color:#fff;font-weight:600}
.small{text-align:center;font-size:12px;color:#7f8aa3;padding:0 4vw 40px}
/* modal */
dialog{border:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;padding:0;color:inherit}
dialog::backdrop{background:rgba(3,10,22,.82);backdrop-filter:blur(4px)}
.sheet{position:relative;margin:4vh auto;width:min(980px,94vw);max-height:92vh;overflow:auto;background:linear-gradient(170deg,var(--navy2),var(--navy));border-radius:14px;border:1px solid rgba(201,162,75,.3);box-shadow:0 30px 80px rgba(0,0,0,.7);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
.sheet .vis{background:#050f20;display:flex;align-items:center;justify-content:center;min-height:300px;position:relative}
.sheet .vis img{width:100%;height:100%;object-fit:cover;max-height:92vh}
.sheet .vis.contain img{object-fit:contain;padding:18px}
.sheet .vis.typo{background:linear-gradient(150deg,var(--c1),var(--c2));padding:30px;align-items:flex-end;justify-content:flex-start}
.sheet .vis.typo .big{font-family:Fraunces,serif;font-weight:600;font-size:clamp(48px,8vw,84px);line-height:.95;color:#fff;letter-spacing:-.02em}
.sheet .body{padding:34px 34px 34px}
.sheet h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.08;color:#fff;margin:6px 0 10px}
.sheet .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;border:1px solid rgba(201,162,75,.55);color:var(--gold);margin-bottom:14px}
.sheet p{font-size:15px;color:#d9dfeb;margin-bottom:12px}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.facts div{flex:1 1 90px;background:rgba(255,255,255,.06);border-radius:8px;padding:10px 12px}
.facts b{display:block;font-family:Fraunces,serif;font-size:26px;color:var(--gold);font-weight:600;line-height:1.1}
.facts span{font-size:12px;color:var(--mut)}
.sheet ul{margin:6px 0 12px 18px;font-size:14.5px;color:#d9dfeb}
.sheet li{margin-bottom:4px}
.links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.x{position:absolute;top:12px;right:14px;z-index:6;width:38px;height:38px;border-radius:50%;border:0;background:rgba(7,26,51,.8);color:#fff;font-size:20px;cursor:pointer}
.sheet .more{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sheet .more img{width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.1)}
@media(max-width:760px){.sheet{grid-template-columns:1fr;margin:2vh auto;max-height:96vh}.sheet .vis{max-height:42vh}.sheet .body{padding:22px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ===== v3 : pages, mouvement ===== */
#app{min-height:100vh}
.page{animation:pgin .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.page{animation:none}*{scroll-behavior:auto!important}}
nav ul a{position:relative}
nav ul a:after{content:"";position:absolute;left:0;bottom:-4px;height:1px;width:0;background:var(--gold);transition:width .3s}
nav ul a:hover:after,nav ul a.on:after{width:100%}
nav ul a.on{border-bottom:0;padding-bottom:0}
/* hero animé */
.hero .photo img{transform:scale(1.08);animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.16) translate(-1.5%,1%)}}
.hero:before{content:"";position:absolute;width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:radial-gradient(circle,rgba(201,162,75,.16),rgba(201,162,75,0) 60%);animation:glow 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes glow{to{transform:translate(8vmax,6vmax)}}
.hero h1{background:linear-gradient(100deg,#fff 40%,#e9cf8f 55%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite}
@keyframes shine{0%,20%{background-position:100% 0}60%,100%{background-position:0 0}}
.scrollhint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut);z-index:3;display:flex;flex-direction:column;align-items:center;gap:8px}
.scrollhint:after{content:"";width:1px;height:34px;background:linear-gradient(var(--gold),transparent);animation:drop 1.8s infinite}
@keyframes drop{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* tuiles chapitres */
.homechap{max-width:1240px;margin:0 auto;padding:90px 4vw 20px}
.homechap>h2{font-family:Fraunces,serif;font-weight:600;font-size:clamp(30px,4.6vw,54px);color:#fff;margin:8px 0 34px}
.chaps{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.chap{position:relative;overflow:hidden;border-radius:14px;min-height:300px;text-decoration:none;color:#fff;display:flex;align-items:flex-end;border:1px solid rgba(255,255,255,.08);grid-column:span 2;isolation:isolate;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.chap:nth-child(1),.chap:nth-child(2){grid-column:span 3;min-height:380px}
.chap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.chap:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(7,26,51,.96) 6%,rgba(7,26,51,.5) 45%,rgba(7,26,51,.1) 80%);transition:opacity .4s}
.chap:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 24px 50px -20px rgba(0,0,0,.8),0 0 0 1px var(--gold)}
.chap:hover img{transform:scale(1.08)}
.chap .in{padding:22px 24px 24px;width:100%}
.chap .num{font-family:Fraunces,serif;font-style:italic;color:var(--gold);font-size:15px;letter-spacing:.06em}
.chap h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(24px,2.6vw,34px);line-height:1.05;margin:4px 0 6px}
.chap p{font-size:14px;color:#d9dfeb;max-width:34ch}
.chap .go{display:inline-block;margin-top:12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);transition:transform .3s}
.chap:hover .go{transform:translateX(6px)}
@media(max-width:900px){.chaps{grid-template-columns:1fr 1fr}.chap,.chap:nth-child(1),.chap:nth-child(2){grid-column:span 1;min-height:260px}}
@media(max-width:560px){.chaps{grid-template-columns:1fr}.chap,.chap:nth-child(1),.chap:nth-child(2){min-height:230px}}
.tri div img{display:block;width:calc(100% + 44px);margin:-22px -22px 18px;height:190px;object-fit:cover;border-radius:7px 7px 0 0}
.proof img{display:block;width:100%;border-radius:8px;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px -16px rgba(0,0,0,.7);margin-top:8px;background:#fff}
/* bandeau Tekwin */
.tkband{max-width:1240px;margin:50px auto 0;padding:0 4vw}
.tkband a{display:grid;grid-template-columns:minmax(0,300px) 1fr;gap:clamp(20px,4vw,50px);align-items:center;padding:20px;border-radius:16px;text-decoration:none;color:#fff;background:linear-gradient(120deg,var(--navy2),var(--navy));border:1px solid rgba(201,162,75,.3);transition:.3s}
.tkband a:hover{border-color:var(--gold);transform:translateY(-4px)}
.tkband img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 25%;border-radius:12px}
.tkband h3{font-family:Fraunces,serif;font-weight:600;font-size:clamp(26px,4vw,44px);line-height:1.05;margin:8px 0}
.tkband p{color:#d9dfeb;max-width:50ch}
.tkband .go{display:inline-block;margin-top:14px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
@media(max-width:700px){.tkband a{grid-template-columns:1fr}}
/* page chapitre */
.chead{position:relative;padding:150px 5vw 56px;overflow:hidden;isolation:isolate}
.chead img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;opacity:.5;object-position:50% 25%}
.chead:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(7,26,51,.55),var(--deep) 98%)}
.chead .wrap{max-width:1100px;margin:0 auto}
.chead h1{font-size:clamp(42px,7vw,88px);margin:10px 0 14px;background:none;color:#fff;animation:none;-webkit-text-fill-color:#fff}
.chead .intro{font-size:clamp(17px,1.6vw,20px);line-height:1.7;color:#e1e6f1;max-width:64ch}
.crumbs{font-size:12.5px;color:var(--mut);margin-bottom:6px}

  body:['Stage de huit semaines à la banque BOA Elite Antaninarenina, en troisième année de licence à l’ISCAM. Il devient le rapport de fin de licence 2024, intitulé « Contribution à l’amélioration de la gestion clientèle ».','## La clientèle Elite','BOA Elite accueille une clientèle haut de gamme : cadres d’institutions, diplomates, ministres, directeurs généraux, entrepreneurs et autres personnalités. Elle attend trois choses avant tout : un service impeccable, des traitements rapides et une confidentialité totale.','## Un cas concret','Un ministre doit renouveler sa carte bancaire mais n’a pas le temps de venir. Son représentant se présente avec une procuration, qui doit normalement être légalisée. Le client exige de la souplesse, la banque doit rester dans ses règles : le rapport part de ce type de situation.','## Ce que le rapport propose','Un catalogue de solutions, évaluées puis budgétisées : des procédures plus souples pour les demandes spéciales, un personnel formé, une équipe dédiée aux clients haut de gamme, des transactions mieux sécurisées, des procurations plus simples à suivre, et des outils numériques comme un assistant en ligne.','## Au quotidien','Stephen travaille aussi aux côtés du responsable communication : il y apprend des méthodes et des raccourcis de graphisme. Le stage lui apprend aussi à écouter les clients et à rester discret.'],facts:[['8','semaines de stage'],['453','personnes interrogées'],['53','réponses au questionnaire']]}, {id:'sos',bg:'q02.jpg',pos:'50% 30%',logos:['sos'],tag:'Premier stage · 2022',title:'Groupe SOS Madagascar',big:'Groupe<br>SOS',small:1,c:G('#4E6B57','#071a33'),st:'Terminé',
  body:['Premier stage de Stephen, en première année de licence à l’ISCAM, du 25 avril au 20 mai 2022. Quatre semaines pour découvrir comment une entreprise fonctionne vraiment.','Le groupe SOS gère plusieurs sociétés : SOS, MAEXI Trading (matériel médical), EOLE (gaz industriels et médicaux) et MADAFLEX (emballages plastiques).','## Quatre semaines, plusieurs métiers','Transit et importation, stock, comptabilité, commercial, administration des ventes, puis ressources humaines. Stephen y voit qu’aucun service ne peut être pris à la légère : quand l’un s’arrête, les autres s’arrêtent aussi.','## La dernière semaine, aux ressources humaines','La plus utile pour lui. Il y suit le recrutement, l’intégration des nouveaux, la mise à jour de l’organigramme et la gestion de la paie. Le rapport de stage porte d’ailleurs sur ce travail.','## Ce qu’il en retient','Mettre en pratique ce que l’ISCAM enseigne, et voir ce que font réellement les employés au quotidien.'],facts:[['4','semaines'],['6','services visités'],['4','sociétés dans le groupe']]}, {id:'ebs1',bg:'ebs1.jpg',pos:'50% 45%',gallery:['ebs_mur.jpg'],logos:['ebs'],tag:'Paris · 2024 – 2025',title:'EBS Paris · master 1',big:'M1',c:G('#13315C','#071a33'),st:'Terminé',
  body:['Master 1 en International Business Management à EBS Paris, après le départ de Madagascar pour Paris. Tous les cours sont en anglais, ce qui fait progresser le sien, certifié au niveau C2.','Stephen y apprend à lire une entreprise à l’échelle du monde : sa stratégie, ses finances, ses équipes, ses négociations. Il y apprend aussi à diriger, à décider avec des données, et à travailler avec des personnes de cultures très différentes.','Ce qui l’y attire le plus : la marque et la communication digitale, et l’entrepreneuriat. Les deux croisent ce qu’il construit ensuite, d’un côté le contenu de marque, de l’autre le projet Stephen Group pour Madagascar.']},
 {id:'ebs2',bg:'m2_verre.jpg',pos:'60% 45%',gallery:['m2_balcon.jpg'],links:[['Voir le témoignage', 'https://www.instagram.com/reel/DWy6lcGCGZz/']],logos:['ebs', 'ferrieres'],tag:'Promotion 2026',title:'EBS × Ferrières · master 2',big:'M2',c:G('#13315C','#946F22'),st:'Promotion 2026',
  body:['Master 2 en double diplôme avec Ferrières, promotion 2026 : le MSc Leadership in Hospitality Management, délivré avec European Business School. La première année se passe à EBS Paris, la deuxième à Ferrières-en-Brie.','Après le business à l’international, Stephen y découvre l’univers de l’hospitalité et du luxe : comment on conçoit un lieu et un concept, comment on pilote sa performance, et comment on fait vivre à un client une expérience qui compte. On y apprend par projets, masterclasses et missions de conseil.','Cette lecture complète celle de l’EBS : le manager qui voit grand, et celui qui soigne chaque détail de l’expérience.']},
 {id:'memoire',bg:'q13.jpg',pos:'50% 35%',logos:['ebs'],tag:'Mémoire de fin d’études · 2026',title:'Cohérence technologique et confiance consommateur',big:'Apple',small:1,c:G('#071a33','#3F6E9B'),st:'Soutenu',
  body:['Le mémoire de fin d’études de Stephen, à l’EBS Paris, promotion 2026, porte sur Apple et sa promesse technologique : photo, vidéo et intelligence artificielle.','## La question','Ce qu’Apple promet sur ses iPhone correspond-il à ce que les utilisateurs vivent au quotidien ? Et cet écart, ou cette cohérence, change-t-il la confiance qu’ils accordent à la marque et leur fidélité, selon qu’ils appartiennent à la génération X, Y ou Z ?','## Le terrain','Des utilisateurs d’iPhone à Madagascar. Sur ce marché, l’iPhone est rare et coûteux : l’avoir est souvent un choix d’identité autant que d’usage. C’est ce qui rend la question intéressante.','## La démarche','Une revue de littérature en trois axes (promesse de marque, confiance et fidélité, différences entre générations), puis une enquête par questionnaire diffusée auprès de répondants à Madagascar, et une analyse statistique des réponses.','## Pourquoi ce sujet','Ce mémoire réunit trois choses qui comptent pour Stephen : la marque, la communication et Madagascar. Il prolonge sa bascule vers le marketing et le brand content.']},
 {id:'inseec',bg:'inseec.jpg',pos:'50% 35%',logos:['inseec'],tag:'Depuis sept. 2026',title:'INSEEC · master 1',big:'INSEEC',c:G('#C9A24B','#13315C'),st:'En cours',
  body:['Master 1 en marketing, communication et stratégie de marque. Stephen pivote vers le marketing, le contenu de marque et la communication.']}
]},
{id:'tekwin',cat:'parcours',title:'Tekwin · alternance',sub:'Assistant chef de projet IT · juillet 2025 – septembre 2026',items:[
 {id:'tk1',bg:'tk_gilet.jpg',pos:'50% 30%',gallery:['tk_fenetre.jpg'],links:[['Voir l’interview', 'https://www.instagram.com/reel/DcmEHAbxEhL/']],logos:['tekwin','accelis'],tag:'Le poste',title:'Assistant chef de projet IT',big:'Tek<br>win',c:G('#946F22','#0B2545'),st:'Terminé',
  body:['Tekwin est un prestataire de services informatiques et de cybersécurité installé à Ferrières-en-Brie, dans la H-Tech Valley, qui fait partie du groupe Accelis. Stephen y est assistant chef de projet IT, en alternance, de juillet 2025 à septembre 2026.','Au début, son trajet dure deux heures trente ; à partir de janvier, il vit à dix minutes à pied.']},
 {id:'tk2',bg:'tk_bureau.jpg',pos:'50% 35%',gallery:['tk_dell.jpg'],logos:['tekwin'],tag:'Premier défi',title:'Odoo, à partir de zéro',big:'300',c:G('#946F22','#13315C'),st:'Terminé',
  body:['Odoo vient d’être mis en place à son arrivée. Stephen devient le premier de la société à l’utiliser, sans véritable formation, en partant d’un outil vide. Il lui faut environ trois mois pour comprendre à la fois le poste et l’outil.','## La migration','Il migre environ trois cents produits depuis l’ancien logiciel, SuperOps : produits configurés selon les consignes de sa responsable, clients créés, données croisées pour les factures, abonnements créés, documentation rédigée, configuration testée.'],facts:[['300','produits migrés'],['3 mois','pour maîtriser']]},
 {id:'tk3',bg:'tk_selfie.jpg',pos:'50% 55%',logos:['tekwin'],tag:'Depuis janvier 2026',title:'Appels de courtoisie',big:'25<br>21<br>13',c:G('#2F8F96','#0B2545'),st:'En place',
  body:['Un bilan par client et par trimestre.','## La méthode','Le mail part un mois et demi avant, avec des créneaux modifiables. Une fois le créneau accepté, il prépare l’appel en relisant les contrats et les services du client. Sans réponse, il relance par téléphone vingt-quatre heures après le mail, puis renvoie un message. Environ six clients sur dix ne répondent pas tout de suite.','## Le résultat','Vingt-cinq appels réalisés, vingt et un clients qui acceptent l’échange, treize qui prennent de nouveaux services après le deuxième bilan. Il en retire une meilleure compréhension des besoins réels et des blocages, plus de transparence, donc plus d’ouverture à d’autres services ou à tout centraliser chez Tekwin.'],facts:[['25','appels'],['21','acceptent'],['13','nouveaux services']]},
 {id:'tk4',bg:'tk_equipe.jpg',pos:'35% 55%',logos:['tekwin'],tag:'Pour la suite',title:'Écrire pour celui qui vient après',big:'15',c:G('#13315C','#946F22'),st:'Livré',
  body:['Stephen écrit pour que d’autres puissent reprendre.','## Guide de procédures','Quinze sections : la routine, les appels avec scripts, les factures, Odoo, les appels de courtoisie et le suivi du chiffre d’affaires. Mis en forme avec Claude.','## Rapports et recrutement','Des rapports hebdomadaires depuis juillet 2025. Une offre d’emploi et une fiche de poste pour la personne qui lui succédera, acceptées par Tekwin.'],facts:[['15','sections du guide'],['1','fiche de poste']]},
 {id:'tk5',gallery:['tk_dell.jpg','tk_ascenseur.jpg'],logos:['tekwin'],tag:'Communication',title:'LinkedIn & Deep Tech Talk',img:'rooftops.jpg',st:'Vidéo publiée',
  body:['Stephen prépare une stratégie éditoriale LinkedIn et des séries de posts à partir de la veille cyber mensuelle. Ils n’ont pas été diffusés par l’entreprise : il était chef de projet, pas community manager.','Il filme et monte la vidéo du Deep Tech Talk de l’École 89 Deep Tech, « Cybersécurité : d’une nécessité à une opportunité business », publiée sur LinkedIn. Tourné avec un iPhone et un stabilisateur DJI.'],links:[['Voir la vidéo','https://www.linkedin.com/posts/stephen-anderson-soahita-715a2b321_cybersaezcuritaez-deeptech-intelligenceartificielle-activity-7477662335428632576-yuJU']]}
]},
{id:'apps',cat:'creations',title:'Applications',sub:'Conçues avec Claude, signées « by Stephen »',items:[
 {id:'famille',bg:'n3.jpg',pos:'45% 50%',tag:'La famille',title:'« by Stephen »',big:'by<br>Stephen',c:G('#13315C','#C9A24B'),st:'Principe',
  body:['Les applications de Stephen forment une famille. Chacune porte la signature « by Stephen » et garde son propre nom, sa propre couleur, sa propre typographie.','Il définit les besoins, les choix et le contenu ; Claude réalise la technique. À terme, toutes appartiennent à la même famille que Stephen Group.'],list:['Kotrana : suivi sportif','Agora : art oratoire','Vola : budget personnel','Carnet de poses : photographie','VisionHub : de l’idée à l’exécution','VisionHub Suivi : suivi d’activité']},
 {id:'kotrana',tag:'Suivi sportif',title:'Kotrana',img:'app_kotrana.jpg',app:1,st:'En usage',
  body:['Application de suivi : séances, exercices, suivi du poids, de la taille et de la santé, avec un plan de huit semaines. « Voir clair. Tenir. »','## L’écran d’accueil','La séance du jour (ici une mobilité facultative, avec « Lancer » ou « Pas envie »), une phrase pour la journée, et un niveau avec des points d’expérience et des semaines tenues.','## Identité','Deux couleurs : un bleu marine profond et un bleu ciel en dégradé, une icône arrondie avec une lettre et un point. Elle sert de référence de style à toute la famille d’applications.','## Derrière l’application','Un plan de transformation sur six mois, cinq jours d’entraînement par semaine, un programme de cardio de vingt-quatre semaines et un tableur de suivi.'],shot:'app_kotrana.jpg'},
 {id:'agora',tag:'Art oratoire',title:'Agora',img:'app_agora.jpg',app:1,st:'En usage',
  body:['Application construite autour du livre L’Art oratoire, installable depuis un téléphone, pensée d’abord pour son usage personnel, sans compte ni paiement.','## Six onglets','Accueil, Studio (enregistrer et analyser sa voix), Cours (66 au total), Orateurs, Préparer et Preuves.','## L’accueil','La prochaine étape, un rang qui progresse avec les points, des objectifs à soi, comme « zéro blanc de plus de 2 secondes ».','## Le nom','L’agora est la place où, dans la cité antique, on prenait la parole. Stephen l’a préféré à Rostra ou Forum. Il a écarté « Kabary », parce que le kabary malgache est une discipline à part, avec ses propres règles et proverbes. Claude est la seule intelligence artificielle derrière les textes générés.'],shot:'app_agora.jpg'},
 {id:'vola',tag:'Budget personnel',title:'Vola',img:'app_vola.jpg',app:1,st:'En usage',
  body:['« Vola » veut dire argent en malgache.','## L’accueil','Le mois en cours, le solde à venir, le solde actuel pointé en banque, le taux d’épargne, et un bilan du mois : revenus, factures, dépenses, épargne nette, bénéfice. Un bouton « + » ajoute une opération.','## Cinq onglets','Accueil, Transactions, Budget, Épargnes et Plus. Le principe : poser un budget de dépenses dans le prévisionnel pour voir ce qu’il reste à dépenser.'],shot:'app_vola.jpg'},
 {id:'carnet',tag:'Pour le photographe',title:'Carnet de poses',img:'app_carnet.jpg',app:1,st:'En usage',
  body:['L’application du photographe : des planches de référence de poses, classées en Homme, Femme et Couple (dix planches pour les hommes), à consulter sur place plutôt que de chercher sur internet.','Assis sur une chaise, autour d’une voiture, d’une moto, appuyé au mur. Chaque planche indique sa source. Elle sert à préparer et diriger une séance photo.'],shot:'app_carnet.jpg'},
 {id:'vh',tag:'De l’idée à l’exécution',title:'VisionHub',img:'app_visionhub.jpg',app:1,wide:1,st:'En usage',
  body:['Transformer une idée en plan de projet testé et chiffré.','## Le tableau de bord','Il compte les projets, les hypothèses validées et les points à vérifier, et compare les projets : investissement de départ, point bas de trésorerie, résultat net, premier mois bénéficiaire, avec un diagnostic en points de couleur. Deux exemples fictifs y figurent : un café-boutique et des paniers de produits locaux.','## Choix de conception','Pour une seule personne, sans mode de groupe, en plusieurs langues dont le français, l’anglais et le malgache ; les données restent dans le navigateur.'],shot:'app_visionhub.jpg'},
 {id:'suivi',tag:'Suivi d’activité',title:'VisionHub Suivi',img:'app_suivi.jpg',app:1,wide:1,st:'En usage',
  body:['Suivre une activité réelle, à la manière d’un budget prévisionnel d’entreprise.','## Cinq entrées','Tableau de bord, saisie, produits, objectifs, données. Le tableau de bord se lit par semaine, mois ou année : chiffre d’affaires, marge brute, dépenses, résultat, objectif de ventes.','Elle servira de base à un outil pour l’activité de sa mère, déjà lancée.'],shot:'app_suivi.jpg'}
]},
{id:'livres',cat:'creations',title:'Livres',sub:'Écrire pour que d’autres apprennent',items:[
 {id:'art1',bg:'q03.jpg',pos:'50% 30%',tag:'Tome I · chapitres 1 – 15',title:'L’Art oratoire : les fondations',big:'Tome<br>I',c:G('#B5651D','#0B2545'),st:'Écrit',
  body:['L’Art oratoire est un manuel en français, d’une vraie profondeur : pas un résumé. Tout est sourcé et vérifiable, rien n’est inventé. Il est écrit pour ceux qui ont du mal à mémoriser, avec des images fortes, des moyens mnémotechniques et la méthode des lieux comme fil rouge. Il est rédigé avec l’aide de Claude, sous sa direction.','## Au programme du tome I','Méthode des lieux, cinq canons classiques, piliers d’Aristote, structure du discours, style, art du récit, art de la citation.','Quatre encadrés par chapitre : À retenir, Erreur fréquente, Méthode rapide, Exercice.'],facts:[['15','chapitres']]},
 {id:'art2',bg:'q12.jpg',pos:'50% 50%',tag:'Tome II · chapitres 16 – 40',title:'L’Art oratoire : la technique',big:'Tome<br>II',c:G('#B5651D','#13315C'),st:'Écrit',
  body:['Voix, corps, mémoire, adaptation au public, questions-réponses, situations difficiles, psychologie de la performance, entraînement.'],facts:[['25','chapitres']]},
 {id:'art3',bg:'q11.jpg',pos:'35% 40%',tag:'Tome III · chapitres 41 – 48',title:'L’Art oratoire : négocier, débattre',big:'Tome<br>III',c:G('#071a33','#B5651D'),st:'À écrire',prep:1,
  body:['Négociation, débat et improvisation. Le plan est posé, le tome reste à écrire.'],facts:[['8','chapitres prévus']]},
 {id:'lse',bg:'q10.jpg',pos:'50% 55%',logos:['speakup'],tag:'Manuel trilingue',title:'Let’s Speak English',big:'Let’s<br>Speak<br>English',c:G('#2F8F96','#0B2545'),st:'Manuel',
  body:['Manuel d’anglais trilingue (anglais, français, malgache), inspiré de la méthode d’un livre malgache, pensé uniquement pour les élèves et destiné à être commercialisé.','## Le cours','Un cours de deux mois, cinq séances par semaine, avec au minimum la moitié du temps en pratique. Un guide de l’enseignant, séparé, contient le déroulement des séances.']},
 {id:'pa',bg:'q09.jpg',pos:'55% 55%',tag:'24 leçons',title:'Programme Anglais',big:'Programme<br>Anglais',small:1,c:G('#3F6E9B','#13315C'),st:'Pour impression',
  body:['Livre de vingt-quatre leçons en français, anglais et malgache, destiné à l’impression.','Son critère : aucune leçon ne ressemble à une autre. Quand la première version s’est révélée trop répétitive, Stephen a tout reconstruit.'],facts:[['24','leçons']]},
 {id:'mitsbook',tag:'Livre photo · 2026',title:'Man in the Shadow',img:'louvre.jpg',st:'2026',
  body:['Le livre photo issu de la photographie de rue à Paris, avec une trame narrative écrite pour se lire comme une histoire.']}
]},
{id:'images',cat:'creations',title:'Photographie & vidéo',sub:'Un regard discret sur les détails du quotidien',items:[
 {id:'mits',tag:'Photographie',title:'Man in the Shadow',img:'louvre.jpg',st:'En ligne',
  body:['Stephen photographie Paris : la rue, le portrait, la nature et le paysage. Signature : « Un regard discret sur les détails du quotidien ». L’idée : révéler ce qui est beau mais que l’on ne regarde pas, raconter une histoire ou une émotion.','## Le site','Un site public de soixante-dix-sept images en cinq chapitres, aussi disponible en application installable.'],facts:[['77','images'],['5','chapitres']],links:[['Ouvrir le site','https://andersonsoahita-hash.github.io/Man-In-The-Shadow/'],['Instagram','https://www.instagram.com/man.in_the_shadow/']],gallery:['sacre.jpg','rooftops.jpg','stairs.jpg','verticale.jpg']},
 {id:'matos',tag:'Matériel & méthode',title:'Sony A6400 & Photoshop',img:'verticale.jpg',st:'En usage',
  body:['Un Sony A6400 avec un objectif 18-135 mm et un 50 mm f/1.8, un trépied et un retardateur pour ses portraits. Toutes les images sont retouchées sous Photoshop.','Comptes : @man.in_the_shadow sur Instagram, @the.man.in.theshadow sur TikTok.']},
 {id:'paris',tag:'Paris',title:'La rue, la nuit, le détail',img:'sacre.jpg',st:'Série',
  body:['Le Sacré-Cœur, les toits bleus, un escalier, un reflet : Paris regardé de côté.'],gallery:['eiffel.jpg','stairs.jpg']},
 {id:'ferrieres',tag:'Film · 43 secondes',title:'Ferrières-en-Brie',img:'poster_ferrieres.jpg',st:'Terminé',
  body:['Film personnel de quarante-trois secondes sur Ferrières-en-Brie, tourné et monté sur CapCut.']},
 {id:'court',bg:'q08.jpg',pos:'55% 60%',tag:'Court métrage · 7 min',title:'Quinze mois',big:'Quinze<br>mois',c:G('#071a33','#946F22'),st:'En préparation',prep:1,
  body:['Un court métrage de sept minutes au maximum sur ses quinze mois d’alternance, pensé pour LinkedIn. Il n’est pas encore tourné.','## Le tournage prévu','Seul, très tôt au lever du soleil, dans sa chambre de neuf mètres carrés, avec un trépied, un stabilisateur DJI et un micro.','## Le fil conducteur','Non pas « on n’est jamais là où on avait prévu d’être », mais « on est exactement là où on est censé être ; le travail, c’est de comprendre pourquoi ».']}
]},
{id:'marques',cat:'creations',title:'Marques & activités',sub:'Mettre une image sur des projets réels',items:[
 {id:'baume',tag:'Identité de marque',title:'Baume Anjara-Soa',img:'j3.jpg',st:'En vente',
  body:['Le baume artisanal de sa mère, vendu à Madagascar. À distance, depuis la France, à sa demande, Stephen en dessine l’identité.','## Ce qu’il a fait','Monogramme AS, étiquette, affiche et flyers pour un salon à Tamatave en 2025. Toutes les photos du produit.','## Le contenu','Un calendrier éditorial de quatre semaines pour Facebook et TikTok, et une stratégie centrée sur la fidélisation plutôt que sur la recherche de nouveaux clients.','La vente sur place revient à l’équipe familiale ; sa part, c’est l’image.'],facts:[['AS','monogramme'],['4','semaines de calendrier']],gallery:['baume_portrait.jpg']},
 {id:'friperie',bg:'q14.jpg',pos:'50% 40%',tag:'Gérée à distance',title:'Friperie d’Antananarivo',big:'Friperie',c:G('#4E6B57','#0B2545'),st:'En activité',
  body:['Une friperie à Antananarivo, pensée pour les femmes de la classe moyenne, gérée à distance : à Stephen le montage, le design et la stratégie ; à une personne de confiance sur place la logistique et le tournage.']}
]},
{id:'voix',cat:'voix',title:'Slam, guitare & coaching',sub:'Une voix à soi',items:[
 {id:'slam',bg:'slam_scene.jpg',pos:'50% 50%',gallery:['slam_escalier.jpg'],tag:'Écriture',title:'Slam',big:'Slam',c:G('#B5651D','#13315C'),st:'En pratique',
  body:['La prise de parole traverse tout le reste : les discours d’accueil de l’association, la présidence, ses propres textes.','Stephen écrit du slam, fortement influencé par Pierre Faury : éloquence, figures de style, jeux de mots, vérité brute mais poétique, rimes internes, pauses orales, fins marquantes mais humaines.','Dans le slam musical, Stephen fait le rythme à la guitare avec une amie pendant qu’une autre personne slame sur scène ; il lui arrive aussi de slamer lui-même en jouant de la guitare.','Une présence en ligne autour de cette voix : Facebook, Instagram et TikTok, centrées sur la prise de parole, le slam, la poésie et le récit.']},
 {id:'guitare',bg:'guitare.jpg',pos:'55% 40%',tag:'Musique',title:'Guitare',big:'Guitare',c:G('#946F22','#0B2545'),st:'En pratique',
  body:['Il joue de la guitare et a écrit une chanson dans l’esprit d’Ed Sheeran et de Vianney, avec un pont slam parlé.']},
 {id:'coach',bg:'coach.jpg',pos:'55% 35%',tag:'Depuis août 2025',title:'Coaching d’art oratoire',big:'Coach',c:G('#B5651D','#071a33'),st:'En cours',
  body:['Depuis août 2025, Stephen se fait accompagner régulièrement par un coach en art oratoire, Ny Avo Razafindrazaka.']}
]},
{id:'speak',cat:'voix',title:'Enseigner l’anglais',sub:'Speak Up English Institute et les manuels',items:[
 {id:'speakup',bg:'q01.jpg',pos:'50% 30%',logos:['speakup'],tag:'Centre de formation',title:'Speak Up English Institute',big:'Speak<br>Up',c:G('#2F8F96','#0B2545'),st:'Lancé · octobre 2026',
  body:['Un centre de formation en anglais dont Stephen est le community manager. Le centre a démarré à Madagascar avec sa première rentrée en octobre 2026.','## Le format','Groupes de douze personnes au maximum, en présentiel en journée à Antananarivo ou en ligne le soir.','## Les manuels','Les manuels Let’s Speak English et Programme Anglais servent de supports.'],facts:[['12','personnes max par groupe']]},
]},

/* ---------- rendu : pages ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const tpl=id=>$('#t-'+id).innerHTML;
const COVER={moi:['q02.jpg','50% 25%'],parcours:['iscam1.jpg','50% 20%'],creations:['q04.jpg','50% 30%'],voix:['slam_scene.jpg','50% 40%'],group:['q13.jpg','50% 25%'],suite:['q03.jpg','50% 30%']};
const ORDER=Object.keys(CATS);
const ITEMS={};ROWS.forEach(r=>r.items.forEach(it=>{it._row=r;it._cat=r.cat;ITEMS[it.id]=it}));
const catRows=c=>ROWS.filter(r=>r.cat===c);
const catItems=c=>catRows(c).flatMap(r=>r.items);

function visual(it){
  if(it.shot) return `<figure class="vis phone${it.wide?' wide':''}"><img src="img/${it.shot}" alt="${it.title}"></figure>`;
  if(it.img){const c=it.contain?' contain':'';return `<figure class="vis photo${c}"><img src="img/${it.img}" alt="${it.title}"></figure>`;}
  const bg=it.bg?`background:linear-gradient(180deg,${it.c[0]}cc 0%,${it.c[0]}33 38%,${it.c[1]}f2 100%),url(img/${it.bg}) ${it.pos||'50% 30%'}/cover`:`background:linear-gradient(155deg,${it.c[0]},${it.c[1]})`;
  return `<figure class="vis typo${it.bg?' bgp':''}" style="${bg}"><div class="big${it.small||it.bg?' s':''}">${it.big}</div><figcaption>${it.tag}</figcaption></figure>`;
}
function body(it){
  const parts=(it.body||[]).map(p=>p.startsWith('## ')?`<h4>${p.slice(3)}</h4>`:`<p>${p}</p>`).join('');
  const list=it.list?`<ul>${it.list.map(x=>`<li>${x}</li>`).join('')}</ul>`:'';
  const facts=it.facts?`<div class="facts">${it.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>`:'';
  const links=it.links?`<div class="links">${it.links.map(l=>`<a class="btn gold" target="_blank" rel="noopener" href="${l[1]}">${l[0]}</a>`).join('')}</div>`:'';
  const gal=it.gallery?`<div class="more">${it.gallery.map(g=>`<img src="img/${g}" alt="">`).join('')}</div>`:'';
  const proof=it.proof?`<h4>La preuve</h4><div class="proof">${it.proof.map(g=>`<img src="img/${g}" alt="Document officiel">`).join('')}</div>`:'';
  return parts+list+facts+links+gal+proof;
}
function tile(it,i){
  let inner,cls='tile rv';
  if(it.shot){cls+=' phoneT';inner=`<div class="bgi"><img src="img/${it.shot}" alt=""></div>`}
  else if(it.img){if(it.contain)cls+=' contain';inner=`<div class="bgi"><img src="img/${it.img}" alt=""></div>`}
  else if(it.bg){inner=`<div class="bgi" style="background-image:url(img/${it.bg});background-position:${it.pos||'50% 30%'}"></div>`}
  else inner=`<div class="bgi" style="background:linear-gradient(155deg,${it.c[0]},${it.c[1]})"></div>`;
  const big=(!it.shot&&!it.img&&it.big&&!/<br>/.test(it.big)&&it.big.length<=7)?`<div class="bigt">${it.big}</div>`:'';
  return `<a class="${cls}" style="--d:${(i%4)*.07}s" href="#/c/${it._cat}/${it.id}">${inner}${it.st?`<span class="st${it.prep?' prep':''}">${it.st}</span>`:''}${big}<div class="cap"><div class="tag">${it.tag}</div><div class="ttl">${it.title}</div></div></a>`;
}
function nextChap(c){
  const nx=ORDER[(ORDER.indexOf(c)+1)%ORDER.length];const d=CATS[nx];
  return `<div class="nextch rv"><a href="#/c/${nx}"><div><small>${d.k} · suite</small><b>${d.t}</b></div><span class="ar">→</span></a></div>`;
}
function home(){
  const chaps=ORDER.map((c,i)=>{const d=CATS[c],cv=COVER[c];
    return `<a class="chap rv" style="--d:${i*.08}s" href="#/c/${c}"><img src="img/${cv[0]}" style="object-position:${cv[1]}" alt=""><div class="in"><div class="num">${d.k}</div><h3>${d.t}</h3><p>${d.d}</p><span class="go">Entrer →</span></div></a>`}).join('');
  app.innerHTML=`<div class="page">${tpl('hero').replace('</header>','<div class="scrollhint">Découvrir</div></header>').replace('href="#cat-moi"','href="#/c/moi"').replace('href="#cat-parcours"','href="#/c/parcours"')}
  <section class="homechap"><div class="kick rv">Six chapitres</div><h2 class="rv">Choisis ta porte d’entrée</h2><div class="chaps">${chaps}</div></section>
  <section class="tkband rv"><a href="#/c/parcours/tk1"><img src="img/tk_gilet.jpg" alt=""><div><div class="kick">Alternance · juillet 2025 – septembre 2026</div><h3>Mon alternance chez Tekwin</h3><p>Assistant chef de projet IT : Odoo, appels de courtoisie, passation, LinkedIn.</p><span class="go">Découvrir →</span></div></a></section>
  ${tpl('thread')}${tpl('foot')}</div>`;
}
function chapter(c){
  const d=CATS[c],cv=COVER[c],rows=catRows(c);
  const tabs=rows.length>1?`<div class="ctabs">${rows.map(r=>`<a href="#/c/${c}" data-sec="${r.id}">${r.title}</a>`).join('')}</div>`:'';
  const secs=rows.map(r=>`<section class="csec" id="s-${r.id}"><div class="ph rv"><h3>${r.title}</h3><span>${r.sub}</span></div><div class="grid">${r.items.map(tile).join('')}</div></section>`).join('');
  app.innerHTML=`<div class="page"><header class="chead"><img src="img/${cv[0]}" style="object-position:${cv[1]}" alt=""><div class="wrap"><div class="crumbs"><a href="#/">Accueil</a> · ${d.k}</div><div class="kick">${d.k}</div><h1>${d.t}</h1><p class="intro">${d.i}</p></div></header>${tabs}<div class="cbody">${secs}</div>${nextChap(c)}${tpl('foot')}</div>`;
  document.querySelectorAll('.ctabs a').forEach(a=>a.onclick=e=>{e.preventDefault();const t=$('#s-'+a.dataset.sec);scrollTo({top:t.getBoundingClientRect().top+scrollY-110,behavior:'smooth'})});
}
function article(id){
  const it=ITEMS[id];if(!it)return home();
  const c=it._cat,list=catItems(c),i=list.indexOf(it),pv=list[i-1],nx=list[i+1];
  const logos=(it.logos||[]).length?`<div class="logos">${it.logos.map(l=>`<img class="${l==='tekwin'?'dk':''}" src="img/logo_${l}.png" alt="logo ${l}">`).join('')}</div>`:'';
  const pn=x=>x?`<a class="${x===nx?'nx':'pv'}" href="#/c/${c}/${x.id}"><small>${x===nx?'Suivant →':'← Précédent'}</small><b>${x.title}</b></a>`:`<a class="ph0"></a>`;
  app.innerHTML=`<div class="page"><div class="apage"><a class="backbtn" href="#/c/${c}">← ${CATS[c].t}</a><div class="crumbs"><a href="#/">Accueil</a> · <a href="#/c/${c}">${CATS[c].t}</a> · ${it._row.title}</div>
  <article class="art" id="a-${it.id}">${visual(it)}<div class="txt2">${logos}<div class="kick">${it.tag}</div><h4 class="t">${it.title}</h4><span class="badge${it.prep?' prep':''}">${it.st}</span>${body(it)}</div></article></div>
  <div class="pn">${pn(pv)}${pn(nx)}</div>${nextChap(c)}${tpl('foot')}</div>`;
}
let io;
function reveal(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
  document.querySelectorAll('.rv').forEach(el=>io.observe(el));
}
function route(){
  const h=location.hash.replace(/^#\/?/,'');const p=h.split('/').filter(Boolean);
  let cur='';
  if(p[0]==='c'&&CATS[p[1]]){cur=p[1];p[2]&&ITEMS[p[2]]?article(p[2]):chapter(p[1])}
  else home();
  document.querySelectorAll('nav ul a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#/c/'+cur));
  scrollTo(0,0);reveal();spy();
}
const bar=$('#bar');
function spy(){
  const h=document.documentElement.scrollHeight-innerHeight;
  bar.style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';
  $('#nav').classList.toggle('solid',scrollY>60);
  const ph=document.querySelector('.hero .photo');if(ph&&scrollY<innerHeight)ph.style.transform=`translateY(${scrollY*.12}px)`;
  const secs=[...document.querySelectorAll('.csec')];
  if(secs.length){let cur=secs[0].id;secs.forEach(s=>{if(s.getBoundingClientRect().top<150)cur=s.id});
    document.querySelectorAll('.ctabs a').forEach(a=>a.classList.toggle('on','s-'+a.dataset.sec===cur))}
}
addEventListener('scroll',spy,{passive:true});
addEventListener('hashchange',route);
route();

</script>
